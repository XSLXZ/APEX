<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX资源中心</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --bg-secondary: #ffffff;
            --text: #1a202c;
            --text-light: #4a5568;
            --text-muted: #a0aec0;
            --primary: #0a6cff;
            --primary-light: #3b82f6;
            --accent: #00d4ff;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --shadow: 0 4px 24px rgba(10, 108, 255, 0.08);
            --shadow-hover: 0 8px 32px rgba(10, 108, 255, 0.15);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --nav-border: rgba(10, 108, 255, 0.1);
            --title-gradient: linear-gradient(90deg, #0a6cff, #00d4ff, #0a6cff);
            --btn-hover: #f0f7ff;
            --input-bg: #ffffff;
            --modal-bg: #ffffff;
            --scrollbar-thumb: #cbd5e0;
            --glow: 0 0 40px rgba(10, 108, 255, 0.3);
            --progress-bg: #e2e8f0;
            --progress-fill: #0a6cff;
            --lock-color: #e53e3e;
            --tag-bg: #ebf5ff;
            --tag-text: #0a6cff;
            --divider: #e2e8f0;
            --code-bg: #f7fafc;
        }

        [data-theme="dark"] {
            --bg: #0a0e17;
            --bg-secondary: #111827;
            --text: #e2e8f0;
            --text-light: #cbd5e0;
            --text-muted: #718096;
            --primary: #00d4ff;
            --primary-light: #3b82f6;
            --accent: #00d4ff;
            --border: #1e2d45;
            --card-bg: #111827;
            --shadow: 0 4px 24px rgba(0, 212, 255, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 212, 255, 0.12);
            --nav-bg: rgba(10, 14, 23, 0.88);
            --nav-border: rgba(0, 212, 255, 0.15);
            --title-gradient: linear-gradient(90deg, #00d4ff, #3b82f6, #00d4ff);
            --btn-hover: #1a2740;
            --input-bg: #111827;
            --modal-bg: #111827;
            --scrollbar-thumb: #2d3748;
            --glow: 0 0 60px rgba(0, 212, 255, 0.2);
            --progress-bg: #1e2d45;
            --progress-fill: #00d4ff;
            --lock-color: #fc8181;
            --tag-bg: #0f2a3f;
            --tag-text: #00d4ff;
            --divider: #1e2d45;
            --code-bg: #0d1a2b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* 背景科技网格 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(10, 108, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(10, 108, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 108, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            transition: all 0.4s ease;
        }
        [data-theme="dark"] body::before {
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(10, 108, 255, 0.04) 0%, transparent 50%),
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 64px;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--nav-border);
            transition: all 0.4s ease;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
        }
        [data-theme="dark"] .navbar {
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .navbar-center {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-light);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-btn:hover {
            background: var(--btn-hover);
            color: var(--primary);
        }
        .nav-btn.active {
            color: var(--primary);
            background: var(--tag-bg);
        }
        .nav-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            position: relative;
        }
        .icon-btn:hover {
            background: var(--btn-hover);
            color: var(--primary);
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
        }
        .icon-btn .tooltip {
            position: absolute;
            bottom: -36px;
            right: 0;
            background: var(--bg-secondary);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .icon-btn:hover .tooltip {
            opacity: 1;
        }

        .nav-logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--title-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .nav-logo.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 主内容 */
        .main-content {
            padding-top: 64px;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 60px;
        }

        /* 首页 */
        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 主标题 */
        .hero-section {
            text-align: center;
            padding: 50px 20px 20px;
            position: relative;
        }

        .main-title {
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 800;
            letter-spacing: 3px;
            line-height: 1.2;
            background: var(--title-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            text-shadow: none;
            position: relative;
            display: inline-block;
            transition: all 0.4s ease;
            cursor: default;
        }
        .main-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: var(--title-gradient);
            background-size: 200% auto;
            border-radius: 4px;
            animation: shimmer 3s linear infinite;
            opacity: 0.7;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        .subtitle {
            margin-top: 18px;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        /* 推荐资源 */
        .recommend-section {
            margin-top: 28px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .recommend-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--title-gradient);
            border-radius: 4px 0 0 4px;
        }
        .recommend-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .recommend-title svg {
            width: 18px;
            height: 18px;
        }
        .recommend-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .recommend-chip {
            padding: 8px 16px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            letter-spacing: 0.5px;
        }
        .recommend-chip:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(10, 108, 255, 0.2);
            transform: translateY(-1px);
        }

        /* 分类栏 */
        .category-section {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .category-scroll {
            flex: 1;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) transparent;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .category-scroll::-webkit-scrollbar {
            height: 5px;
        }
        .category-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .category-scroll::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        .cat-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-light);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .cat-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(10, 108, 255, 0.1);
        }
        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(10, 108, 255, 0.3);
        }
        .cat-btn .count {
            opacity: 0.7;
            font-size: 11px;
            margin-left: 3px;
        }

        .cat-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            flex-shrink: 0;
            position: relative;
        }
        .cat-action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(10, 108, 255, 0.1);
        }
        .cat-action-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .cat-action-btn svg {
            width: 18px;
            height: 18px;
        }
        .cat-action-btn .tooltip {
            position: absolute;
            bottom: -36px;
            right: 0;
            background: var(--bg-secondary);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .cat-action-btn:hover .tooltip {
            opacity: 1;
        }

        /* 资源列表 */
        .resource-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .resource-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .resource-item:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .resource-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--primary-light);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .resource-item:hover::before {
            opacity: 1;
        }

        .resource-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .resource-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.3px;
            transition: color 0.25s ease;
            text-decoration: none;
        }
        .resource-item:hover .resource-title {
            color: var(--primary);
        }
        .resource-id {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--tag-bg);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .resource-lock {
            display: inline-flex;
            align-items: center;
            color: var(--lock-color);
            flex-shrink: 0;
            margin-left: 4px;
        }
        .resource-lock svg {
            width: 16px;
            height: 16px;
        }
        .resource-notes {
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            line-height: 1.5;
            padding-left: 4px;
            border-left: 2px solid var(--border);
            padding-left: 12px;
        }

        /* 加载动画 */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .progress-container {
            width: 100%;
            max-width: 300px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--progress-bg);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* 搜索页 */
        .search-container {
            padding: 30px 0;
            max-width: 700px;
            margin: 0 auto;
        }
        .search-input-wrap {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 0 16px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        .search-input-wrap:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(10, 108, 255, 0.15);
        }
        .search-input-wrap svg {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .search-input {
            flex: 1;
            padding: 14px 12px;
            border: none;
            background: transparent;
            font-size: 15px;
            color: var(--text);
            outline: none;
            letter-spacing: 0.5px;
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }
        .search-results-info {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            padding-left: 4px;
        }

        /* 关于页 */
        .about-container {
            padding: 30px 0;
            max-width: 800px;
            margin: 0 auto;
        }
        .about-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
            background: var(--title-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        .about-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .about-item img {
            max-width: 100%;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        .about-item .text-content {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-light);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .about-item .file-link {
            display: inline-block;
            padding: 8px 16px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.25s ease;
        }
        .about-item .file-link:hover {
            box-shadow: 0 2px 12px rgba(10, 108, 255, 0.2);
        }
        .about-item .file-name {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* 密码弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--modal-bg);
            border-radius: 16px;
            padding: 28px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            animation: slideUp 0.3s ease;
            position: relative;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-title svg {
            width: 20px;
            height: 20px;
            color: var(--lock-color);
        }
        .modal-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }
        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        .modal-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 14px rgba(10, 108, 255, 0.15);
        }
        .modal-tip {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.3px;
            padding: 8px 12px;
            background: var(--tag-bg);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }
        .modal-btn.primary {
            background: var(--primary);
            color: #fff;
        }
        .modal-btn.primary:hover {
            box-shadow: 0 4px 16px rgba(10, 108, 255, 0.35);
            transform: translateY(-1px);
        }
        .modal-btn.secondary {
            background: var(--btn-hover);
            color: var(--text-light);
        }
        .modal-btn.secondary:hover {
            background: var(--border);
        }
        .modal-error {
            color: var(--lock-color);
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 0.3px;
            display: none;
        }

        /* 设置面板 */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1500;
            display: flex;
            justify-content: flex-end;
            animation: fadeInOverlay 0.25s ease;
        }
        .settings-panel {
            width: 100%;
            max-width: 380px;
            background: var(--bg-secondary);
            height: 100%;
            padding: 24px;
            overflow-y: auto;
            animation: slideInRight 0.3s ease;
            border-left: 1px solid var(--border);
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .settings-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .settings-close {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }
        .settings-close:hover {
            background: var(--btn-hover);
            color: var(--text);
        }
        .settings-close svg {
            width: 18px;
            height: 18px;
        }
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--divider);
        }
        .setting-label {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: var(--text-light);
        }
        .setting-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.2px;
        }
        .toggle-switch {
            width: 46px;
            height: 26px;
            background: var(--border);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border: none;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: var(--primary);
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        .toggle-switch.active::after {
            left: 23px;
        }
        .setting-select {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        .setting-select:focus {
            border-color: var(--primary);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 1px;
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 12px;
                height: 56px;
            }
            .main-content {
                padding-top: 56px;
                padding-left: 12px;
                padding-right: 12px;
            }
            .nav-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            .nav-btn svg {
                width: 16px;
                height: 16px;
            }
            .nav-btn span {
                display: none;
            }
            .icon-btn {
                width: 36px;
                height: 36px;
            }
            .main-title {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
            .subtitle {
                font-size: 0.95rem;
            }
            .hero-section {
                padding: 30px 12px 12px;
            }
            .resource-item {
                padding: 12px 16px;
            }
            .resource-title {
                font-size: 14px;
            }
            .category-section {
                gap: 6px;
            }
            .cat-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            .modal-box {
                padding: 20px;
            }
            .settings-panel {
                max-width: 100%;
                padding: 16px;
            }
            .navbar-center {
                gap: 2px;
            }
        }

        @media (max-width: 480px) {
            .nav-btn {
                padding: 4px 6px;
                font-size: 11px;
            }
            .main-title {
                font-size: 1.5rem;
            }
            .cat-btn {
                padding: 5px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- 主内容 -->
    <div class="main-content">

        <!-- 首页 -->

            <div class="hero-section">

    <!-- 密码弹窗 -->

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>

            <div class="setting-item">

                <div>
                    <div class="setting-label">访问统计</div>

                </div>
                <span id="busuanzi_container_site_pv" style="font-size:16px;font-weight:600;color:var(--primary);">
                    <span id="busuanzi_value_site_pv">0</span> 次
                </span>

    <script>
        (function() {
            // ============ 全局状态 ============
            const state = {
                resources: [],
                categories: [],
                currentCategory: '全部',
                multiSelectMode: false,
                selectedCategories: [],
                sortDirection: 'asc', // 'asc' | 'desc'
                isAdmin: false,
                adminPassword: '',
                currentPage: 'home',
                theme: 'light',
                isLoading: false,
                listFileExists: false,
                aboutFilesLoaded: false,
                searchQuery: '',
                settings: {
                    shimmerEnabled: true,
                    loadingAnimEnabled: true,
                    density: 'normal',
                    fontSize: 'medium',
                    animSpeed: 'normal',
                    defaultSort: 'asc'
                }
            };

            // ============ DOM 引用 ============
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const navbar = $('#navbar');
            const navLogo = $('#navLogo');
            const mainTitle = $('#mainTitle');
            const subtitle = $('#subtitle');
            const navButtons = $$('.nav-btn');
            const pages = {
                home: $('#page-home'),
                search: $('#page-search'),
                about: $('#page-about')
            };
            const categoryScroll = $('#categoryScroll');
            const categorySection = $('#categorySection');
            const resourceList = $('#resourceList');
            const resourceLoading = $('#resourceLoading');
            const progressFill = $('#progressFill');
            const progressText = $('#progressText');
            const recommendSection = $('#recommendSection');
            const recommendList = $('#recommendList');
            const searchInput = $('#searchInput');
            const searchResultsInfo = $('#searchResultsInfo');
            const searchResultsList = $('#searchResultsList');
            const aboutContent = $('#aboutContent');
            const aboutLoading = $('#aboutLoading');
            const passwordModal = $('#passwordModal');
            const modalDesc = $('#modalDesc');
            const modalPassword = $('#modalPassword');
            const modalTip = $('#modalTip');
            const modalError = $('#modalError');
            const modalCancel = $('#modalCancel');
            const modalConfirm = $('#modalConfirm');
            const identityModal = $('#identityModal');
            const adminPassword = $('#adminPassword');
            const adminError = $('#adminError');
            const adminCancel = $('#adminCancel');
            const adminConfirm = $('#adminConfirm');
            const settingsOverlay = $('#settingsOverlay');
            const settingsClose = $('#settingsClose');
            const settingsBtn = $('#settingsBtn');
            const identityBtn = $('#identityBtn');
            const multiSelectBtn = $('#multiSelectBtn');
            const sortBtn = $('#sortBtn');
            const themeToggle = $('#themeToggle');
            const shimmerToggle = $('#shimmerToggle');
            const loadingAnimToggle = $('#loadingAnimToggle');
            const densitySelect = $('#densitySelect');
            const fontSizeSelect = $('#fontSizeSelect');
            const animSpeedSelect = $('#animSpeedSelect');
            const defaultSortSelect = $('#defaultSortSelect');
            const adminStatItem = $('#adminStatItem');

            // ============ 工具函数 ============
            function debounce(fn, ms) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), ms);
                };
            }

            function sleep(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            async function fetchWithTimeout(url, timeout = 8000) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), timeout);
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!response.ok) return null;
                    return response;
                } catch (e) {
                    return null;
                }
            }

            async function fetchText(url) {
                const resp = await fetchWithTimeout(url);
                if (!resp) return null;
                try {
                    const text = await resp.text();
                    return text.trim();
                } catch (e) {
                    return null;
                }
            }

            // ============ 主题管理 ============
            function applyTheme(theme) {
                state.theme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                themeToggle.classList.toggle('active', theme === 'light');
                try {
                    localStorage.setItem('apex-theme', theme);
                } catch (e) {}
            }

            function toggleTheme() {
                applyTheme(state.theme === 'light' ? 'dark' : 'light');
                // 重新渲染资源列表以适配新主题
                if (state.resources.length > 0) {
                    renderResourceList();
                }
            }

            // ============ 设置管理 ============
            function loadSettings() {
                try {
                    const saved = localStorage.getItem('apex-settings');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        Object.assign(state.settings, parsed);
                    }
                    const savedTheme = localStorage.getItem('apex-theme');
                    if (savedTheme) {
                        state.theme = savedTheme;
                        document.documentElement.setAttribute('data-theme', state.theme);
                    }
                } catch (e) {}
                // 应用设置
                shimmerToggle.classList.toggle('active', state.settings.shimmerEnabled);
                loadingAnimToggle.classList.toggle('active', state.settings.loadingAnimEnabled);
                densitySelect.value = state.settings.density;
                fontSizeSelect.value = state.settings.fontSize;
                animSpeedSelect.value = state.settings.animSpeed;
                defaultSortSelect.value = state.settings.defaultSort;
                themeToggle.classList.toggle('active', state.theme === 'light');
                applyDensity(state.settings.density);
                applyFontSize(state.settings.fontSize);
                applyAnimSpeed(state.settings.animSpeed);
                state.sortDirection = state.settings.defaultSort;
                // 应用流光设置
                if (!state.settings.shimmerEnabled) {
                    document.documentElement.style.setProperty('--title-gradient', 'linear-gradient(90deg, var(--primary), var(--primary))');
                } else {
                    document.documentElement.style.setProperty('--title-gradient',
                        state.theme === 'dark' ?
                        'linear-gradient(90deg, #00d4ff, #3b82f6, #00d4ff)' :
                        'linear-gradient(90deg, #0a6cff, #00d4ff, #0a6cff)'
                    );
                }
            }

            function saveSettings() {
                try {
                    localStorage.setItem('apex-settings', JSON.stringify(state.settings));
                    localStorage.setItem('apex-theme', state.theme);
                } catch (e) {}
            }

            function applyDensity(density) {
                const items = $$('.resource-item');
                items.forEach(item => {
                    if (density === 'compact') {
                        item.style.padding = '8px 14px';
                    } else if (density === 'loose') {
                        item.style.padding = '20px 26px';
                    } else {
                        item.style.padding = '16px 20px';
                    }
                });
            }

            function applyFontSize(size) {
                const root = document.documentElement;
                if (size === 'small') {
                    root.style.fontSize = '14px';
                } else if (size === 'large') {
                    root.style.fontSize = '17px';
                } else {
                    root.style.fontSize = '15px';
                }
            }

            function applyAnimSpeed(speed) {
                const root = document.documentElement;
                if (speed === 'fast') {
                    root.style.setProperty('--anim-dur', '0.15s');
                } else if (speed === 'slow') {
                    root.style.setProperty('--anim-dur', '0.5s');
                } else {
                    root.style.setProperty('--anim-dur', '0.3s');
                }
            }

            // ============ 导航 ============
            function navigateTo(page) {
                state.currentPage = page;
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === page);
                });
                navButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.page === page);
                });
                if (page === 'about' && !state.aboutFilesLoaded) {
                    loadAboutContent();
                }
                if (page === 'search') {
                    searchInput.focus();
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            navButtons.forEach(btn => {
                btn.addEventListener('click', () => navigateTo(btn.dataset.page));
            });

            navLogo.addEventListener('click', () => navigateTo('home'));

            // ============ 滚动标题缩小 ============
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const scrollY = window.scrollY;
                    if (scrollY > 80) {
                        navLogo.classList.add('visible');
                    } else {
                        navLogo.classList.remove('visible');
                    }
                }, 10);
            }, { passive: true });

            // ============ 资源数据加载 ============
            async function fetchResourceFile(id, filename) {
                const url = `库/list/${id}/${filename}`;
                return await fetchText(url);
            }

            async function detectResourceIds() {
                // 尝试清单文件
                const listContent = await fetchText('库/list/list.txt');
                if (listContent) {
                    const ids = listContent.split(/\s+/).filter(s => s.trim() && !isNaN(Number(s.trim()))).map(Number);
                    if (ids.length > 0) {
                        state.listFileExists = true;
                        return ids.sort((a, b) => a - b);
                    }
                }
                // 连续编号探测
                const ids = [];
                const maxProbe = 500;
                const batchSize = 10;
                for (let start = 1; start <= maxProbe; start += batchSize) {
                    const batchPromises = [];
                    for (let i = start; i < start + batchSize && i <= maxProbe; i++) {
                        batchPromises.push(fetchResourceFile(i, 'Title.txt').then(text => ({
                            id: i,
                            exists: text !== null && text !== ''
                        })));
                    }
                    const results = await Promise.all(batchPromises);
                    let foundInBatch = false;
                    for (const r of results) {
                        if (r.exists) {
                            ids.push(r.id);
                            foundInBatch = true;
                        } else if (foundInBatch && ids.length > 0 && r.id > ids[ids.length - 1] + 2) {
                            // 如果遇到连续多个不存在且已经找到一些ID，提前结束
                        }
                    }
                    // 如果这个批次没有找到任何资源，且之前已经找到了一些，说明可能到达末尾
                    if (!foundInBatch && ids.length > 0) {
                        // 再探一批确认
                        const confirmPromises = [];
                        for (let i = start + batchSize; i < start + batchSize * 2 && i <= maxProbe; i++) {
                            confirmPromises.push(fetchResourceFile(i, 'Title.txt').then(text => ({
                                id: i,
                                exists: text !== null && text !== ''
                            })));
                        }
                        const confirmResults = await Promise.all(confirmPromises);
                        const anyFound = confirmResults.some(r => r.exists);
                        if (!anyFound) break;
                    }
                    if (!foundInBatch && ids.length === 0 && start > 30) {
                        // 完全没有资源的情况
                        break;
                    }
                    // 进度更新
                    const progress = Math.min(80, (start / maxProbe) * 80);
                    updateProgress(progress, '正在扫描资源...');
                }
                return ids.sort((a, b) => a - b);
            }

            async function loadResourceDetails(id) {
                const title = await fetchResourceFile(id, 'Title.txt') || `资源${id}`;
                const type = await fetchResourceFile(id, 'Type.txt') || '未分类';
                const notes = await fetchResourceFile(id, 'Notes.txt') || '';
                const keyExists = await fetchResourceFile(id, 'Key.txt');
                let tip = '';
                if (keyExists !== null) {
                    tip = (await fetchResourceFile(id, 'Tip.txt')) || '';
                }
                return {
                    id,
                    title,
                    type,
                    notes,
                    locked: keyExists !== null,
                    key: keyExists || '',
                    tip,
                    htmlPath: `库/list/${id}/${id}.html`
                };
            }

            function updateProgress(percent, text) {
                progressFill.style.width = percent + '%';
                progressText.textContent = text || `${Math.round(percent)}%`;
            }

            async function loadAllResources() {
                if (state.isLoading) return;
                state.isLoading = true;
                resourceLoading.style.display = 'flex';
                updateProgress(0, '正在扫描资源...');

                try {
                    const ids = await detectResourceIds();
                    if (ids.length === 0) {
                        resourceLoading.style.display = 'none';
                        resourceList.innerHTML =
                            `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>暂无资源，请检查库文件夹配置</div>`;
                        return;
                    }

                    updateProgress(85, `发现 ${ids.length} 个资源，正在加载详情...`);
                    const batchSize = 8;
                    const resources = [];
                    for (let i = 0; i < ids.length; i += batchSize) {
                        const batch = ids.slice(i, i + batchSize);
                        const batchResults = await Promise.all(batch.map(id => loadResourceDetails(id)));
                        resources.push(...batchResults);
                        updateProgress(85 + (i + batch.length) / ids.length * 15, `加载中 ${i + batch.length}/${ids.length}`);
                    }

                    state.resources = resources;
                    updateProgress(100, '加载完成');
                    await sleep(200);
                    resourceLoading.style.display = 'none';
                    extractCategories();
                    renderCategoryButtons();
                    renderResourceList();
                    loadRecommendations();
                } catch (e) {
                    resourceLoading.style.display = 'none';
                    resourceList.innerHTML = `<div class="empty-state">加载失败，请检查网络或文件夹配置</div>`;
                } finally {
                    state.isLoading = false;
                }
            }

            // ============ 分类处理 ============
            function extractCategories() {
                const cats = new Set();
                state.resources.forEach(r => {
                    if (r.type && r.type !== '未分类') cats.add(r.type);
                });
                if (cats.size === 0) cats.add('未分类');
                state.categories = ['全部', ...Array.from(cats).sort()];
            }

            function getCategoryCount(cat) {
                if (cat === '全部') return state.resources.length;
                return state.resources.filter(r => r.type === cat).length;
            }

            function renderCategoryButtons() {
                categoryScroll.innerHTML = '';
                state.categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-btn';
                    if (cat === state.currentCategory && !state.multiSelectMode) btn.classList.add('active');
                    const count = getCategoryCount(cat);
                    btn.innerHTML = `${cat} <span class="count">(${count})</span>`;
                    btn.dataset.category = cat;
                    btn.addEventListener('click', () => handleCategoryClick(cat, btn));
                    categoryScroll.appendChild(btn);
                });
            }

            function handleCategoryClick(cat, btn) {
                if (state.multiSelectMode) {
                    if (cat === '全部') {
                        state.selectedCategories = [];
                        $$('.cat-btn').forEach(b => b.classList.remove('active'));
                        state.currentCategory = '全部';
                        renderResourceList();
                        return;
                    }
                    const idx = state.selectedCategories.indexOf(cat);
                    if (idx >= 0) {
                        state.selectedCategories.splice(idx, 1);
                        btn.classList.remove('active');
                    } else {
                        state.selectedCategories.push(cat);
                        btn.classList.add('active');
                    }
                    if (state.selectedCategories.length === 0) {
                        state.currentCategory = '全部';
                    } else {
                        state.currentCategory = '多选';
                    }
                    renderResourceList();
                } else {
                    state.currentCategory = cat;
                    $$('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderResourceList();
                }
            }

            function getFilteredResources() {
                let filtered = [...state.resources];
                if (state.multiSelectMode && state.selectedCategories.length > 0) {
                    filtered = filtered.filter(r => state.selectedCategories.includes(r.type));
                } else if (!state.multiSelectMode && state.currentCategory !== '全部') {
                    filtered = filtered.filter(r => r.type === state.currentCategory);
                }
                // 排序
                filtered.sort((a, b) => {
                    if (state.sortDirection === 'asc') return a.id - b.id;
                    return b.id - a.id;
                });
                return filtered;
            }

            // ============ 资源列表渲染 ============
            function renderResourceList() {
                if (state.resources.length === 0) return;
                const filtered = getFilteredResources();
                if (filtered.length === 0) {
                    resourceList.innerHTML = `<div class="empty-state">该分类下暂无资源</div>`;
                    return;
                }
                let html = '';
                filtered.forEach(r => {
                    const lockIcon = r.locked ?
                        `<span class="resource-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>` :
                        '';
                    const notesHtml = r.notes ? `<div class="resource-notes">${escapeHtml(r.notes)}</div>` : '';
                    html += `
                        <div class="resource-item" data-id="${r.id}" data-locked="${r.locked}">
                            <div class="resource-header">
                                <span class="resource-title">${escapeHtml(r.title)}</span>
                                <span class="resource-id">#${String(r.id).padStart(3, '0')}</span>
                                ${lockIcon}
                            </div>
                            ${notesHtml}
                        </div>
                    `;
                });
                resourceList.innerHTML = html;
                applyDensity(state.settings.density);

                // 点击事件
                $$('.resource-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = parseInt(item.dataset.id);
                        const locked = item.dataset.locked === 'true';
                        const resource = state.resources.find(r => r.id === id);
                        if (!resource) return;
                        if (resource.locked && !state.isAdmin) {
                            showPasswordModal(resource);
                        } else {
                            window.location.href = resource.htmlPath;
                        }
                    });
                });
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ============ 推荐资源 ============
            async function loadRecommendations() {
                const newContent = await fetchText('库/new.txt');
                if (!newContent || newContent.trim() === '') {
                    recommendSection.style.display = 'none';
                    return;
                }
                const ids = newContent.trim().split(/\s+/).filter(s => !isNaN(Number(s))).map(Number);
                const validIds = ids.filter(id => state.resources.some(r => r.id === id));
                if (validIds.length === 0) {
                    recommendSection.style.display = 'none';
                    return;
                }
                recommendSection.style.display = 'block';
                recommendList.innerHTML = '';
                validIds.forEach(id => {
                    const resource = state.resources.find(r => r.id === id);
                    if (!resource) return;
                    const chip = document.createElement('button');
                    chip.className = 'recommend-chip';
                    chip.textContent = `#${id} ${resource.title}`;
                    chip.addEventListener('click', () => {
                        if (resource.locked && !state.isAdmin) {
                            showPasswordModal(resource);
                        } else {
                            window.location.href = resource.htmlPath;
                        }
                    });
                    recommendList.appendChild(chip);
                });
            }

            // ============ 密码验证 ============
            let pendingResource = null;

            function showPasswordModal(resource) {
                pendingResource = resource;
                modalDesc.textContent = `资源 #${resource.id} "${resource.title}" 已加密`;
                if (resource.tip) {
                    modalTip.textContent = resource.tip;
                    modalTip.style.display = 'block';
                } else {
                    modalTip.style.display = 'none';
                }
                modalError.style.display = 'none';
                modalPassword.value = '';
                passwordModal.style.display = 'flex';
                setTimeout(() => modalPassword.focus(), 100);
            }

            function hidePasswordModal() {
                passwordModal.style.display = 'none';
                pendingResource = null;
            }

            modalCancel.addEventListener('click', hidePasswordModal);
            passwordModal.addEventListener('click', (e) => {
                if (e.target === passwordModal) hidePasswordModal();
            });

            modalConfirm.addEventListener('click', () => {
                if (!pendingResource) return;
                const input = modalPassword.value.trim();
                if (input === pendingResource.key) {
                    hidePasswordModal();
                    window.location.href = pendingResource.htmlPath;
                } else {
                    modalError.style.display = 'block';
                    modalPassword.value = '';
                    modalPassword.focus();
                }
            });

            modalPassword.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') modalConfirm.click();
            });

            // ============ 身份切换 ============
            identityBtn.addEventListener('click', () => {
                if (state.isAdmin) {
                    // 切换回普通用户
                    state.isAdmin = false;
                    identityBtn.style.color = '';
                    adminStatItem.style.display = 'none';
                    identityBtn.querySelector('.tooltip').textContent = '切换身份';
                    identityBtn.style.background = 'transparent';
                    alert('已切换为普通用户');
                } else {
                    adminError.style.display = 'none';
                    adminPassword.value = '';
                    identityModal.style.display = 'flex';
                    setTimeout(() => adminPassword.focus(), 100);
                }
            });

            function hideIdentityModal() {
                identityModal.style.display = 'none';
            }

            adminCancel.addEventListener('click', hideIdentityModal);
            identityModal.addEventListener('click', (e) => {
                if (e.target === identityModal) hideIdentityModal();
            });

            adminConfirm.addEventListener('click', async () => {
                const input = adminPassword.value.trim();
                if (!state.adminPassword) {
                    // 从key.txt加载管理员密码
                    const keyContent = await fetchText('库/key.txt');
                    state.adminPassword = keyContent || '';
                }
                if (input === state.adminPassword && input !== '') {
                    state.isAdmin = true;
                    hideIdentityModal();
                    identityBtn.style.color = 'var(--primary)';
                    identityBtn.style.background = 'var(--tag-bg)';
                    identityBtn.querySelector('.tooltip').textContent = '管理员模式';
                    adminStatItem.style.display = 'flex';
                    // 重新渲染资源列表（消除锁限制显示）
                    renderResourceList();
                } else {
                    adminError.style.display = 'block';
                    adminPassword.value = '';
                    adminPassword.focus();
                }
            });

            adminPassword.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') adminConfirm.click();
            });

            // ============ 搜索 ============
            const debouncedSearch = debounce(() => {
                const query = searchInput.value.trim().toLowerCase();
                if (!query) {
                    searchResultsInfo.textContent = '';
                    searchResultsList.innerHTML = '';
                    return;
                }
                if (state.resources.length === 0) {
                    searchResultsInfo.textContent = '资源尚未加载，请先回到首页加载';
                    return;
                }
                const results = state.resources
                    .map(r => {
                        let score = 0;
                        let matchType = '';
                        if (r.title.toLowerCase().includes(query)) { score = 4;
                            matchType = '标题'; } else if (String(r.id).includes(query)) { score = 3;
                            matchType = '编号'; } else if (r.notes.toLowerCase().includes(query)) { score = 2;
                            matchType = '备注'; } else if (r.type.toLowerCase().includes(query)) { score = 1;
                            matchType = '类型'; }
                        return { ...r, score, matchType };
                    })
                    .filter(r => r.score > 0)
                    .sort((a, b) => b.score - a.score || a.id - b.id);

                searchResultsInfo.textContent = `找到 ${results.length} 条结果`;
                if (results.length === 0) {
                    searchResultsList.innerHTML = `<div class="empty-state">未找到匹配的资源</div>`;
                    return;
                }
                let html = '';
                results.forEach(r => {
                    const lockIcon = r.locked ?
                        `<span class="resource-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>` :
                        '';
                    const matchBadge = `<span class="resource-id" style="background:var(--tag-bg);color:var(--tag-text);">${r.matchType}匹配</span>`;
                    const notesHtml = r.notes ? `<div class="resource-notes">${escapeHtml(r.notes)}</div>` : '';
                    html += `
                        <div class="resource-item search-result-item" data-id="${r.id}" data-locked="${r.locked}">
                            <div class="resource-header">
                                <span class="resource-title">${escapeHtml(r.title)}</span>
                                <span class="resource-id">#${String(r.id).padStart(3, '0')}</span>
                                ${matchBadge}
                                ${lockIcon}
                            </div>
                            ${notesHtml}
                        </div>
                    `;
                });
                searchResultsList.innerHTML = html;
                applyDensity(state.settings.density);
                $$('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = parseInt(item.dataset.id);
                        const locked = item.dataset.locked === 'true';
                        const resource = state.resources.find(r => r.id === id);
                        if (!resource) return;
                        if (resource.locked && !state.isAdmin) {
                            showPasswordModal(resource);
                        } else {
                            window.location.href = resource.htmlPath;
                        }
                    });
                });
            }, 300);

            searchInput.addEventListener('input', debouncedSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') debouncedSearch();
            });

            // ============ 关于页面 ============
            async function loadAboutContent() {
                state.aboutFilesLoaded = true;
                aboutLoading.style.display = 'flex';
                const files = [];
                const commonExts = ['txt', 'jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'pdf', 'mp4', 'webm',
                    'mp3', 'wav', 'zip', 'rar', 'md', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'
                ];
                // 尝试清单文件
                const listContent = await fetchText('库/about/list.txt');
                if (listContent) {
                    const entries = listContent.split(/\s+/).filter(s => s.trim());
                    for (const entry of entries) {
                        files.push(entry);
                    }
                } else {
                    // 连续编号探测
                    for (let i = 1; i <= 100; i++) {
                        let found = false;
                        for (const ext of commonExts) {
                            const resp = await fetchWithTimeout(`库/about/${i}.${ext}`);
                            if (resp && resp.ok) {
                                files.push(`${i}.${ext}`);
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            // 连续3个编号都没找到就停止
                            let allEmpty = true;
                            for (let j = i + 1; j <= i + 3; j++) {
                                for (const ext of commonExts) {
                                    const resp = await fetchWithTimeout(`库/about/${j}.${ext}`);
                                    if (resp && resp.ok) {
                                        allEmpty = false;
                                        break;
                                    }
                                }
                                if (!allEmpty) break;
                            }
                            if (allEmpty) break;
                        }
                    }
                }
                aboutLoading.style.display = 'none';
                if (files.length === 0) {
                    aboutContent.innerHTML = `<div class="empty-state">暂无关于内容</div>`;
                    return;
                }
                let html = '';
                for (const file of files) {
                    const fileUrl = `库/about/${file}`;
                    const ext = file.split('.').pop().toLowerCase();
                    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) {
                        html += `<div class="about-item"><div class="file-name">${file}</div><img src="${fileUrl}" alt="${file}" loading="lazy"></div>`;
                    } else if (ext === 'txt' || ext === 'md') {
                        const content = await fetchText(fileUrl);
                        html +=
                            `<div class="about-item"><div class="file-name">${file}</div><div class="text-content">${content ? escapeHtml(content) : '（空文件）'}</div></div>`;
                    } else if (['mp4', 'webm'].includes(ext)) {
                        html +=
                            `<div class="about-item"><div class="file-name">${file}</div><video controls style="max-width:100%;border-radius:10px;"><source src="${fileUrl}" type="video/${ext}"></video></div>`;
                    } else if (['mp3', 'wav'].includes(ext)) {
                        html +=
                            `<div class="about-item"><div class="file-name">${file}</div><audio controls style="width:100%;"><source src="${fileUrl}" type="audio/${ext}"></audio></div>`;
                    } else {
                        html +=
                            `<div class="about-item"><div class="file-name">${file}</div><a class="file-link" href="${fileUrl}" target="_blank" rel="noopener">下载/查看文件</a></div>`;
                    }
                }
                aboutContent.innerHTML = html;
            }

            // ============ 多选和排序 ============
            multiSelectBtn.addEventListener('click', () => {
                state.multiSelectMode = !state.multiSelectMode;
                multiSelectBtn.classList.toggle('active', state.multiSelectMode);
                if (!state.multiSelectMode) {
                    state.selectedCategories = [];
                    $$('.cat-btn').forEach(b => b.classList.remove('active'));
                    state.currentCategory = '全部';
                    // 高亮"全部"按钮
                    const allBtn = categoryScroll.querySelector('[data-category="全部"]');
                    if (allBtn) allBtn.classList.add('active');
                }
                renderResourceList();
            });

            sortBtn.addEventListener('click', () => {
                state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
                renderResourceList();
                // 更新图标方向
                const icon = sortBtn.querySelector('svg');
                if (icon) {
                    icon.style.transform = state.sortDirection === 'asc' ? 'rotate(0deg)' : 'rotate(180deg)';
                    icon.style.transition = 'transform 0.3s ease';
                }
            });

            // ============ 设置面板 ============
            settingsBtn.addEventListener('click', () => {
                settingsOverlay.style.display = 'flex';
            });

            settingsClose.addEventListener('click', () => {
                settingsOverlay.style.display = 'none';
                saveSettings();
            });

            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) {
                    settingsOverlay.style.display = 'none';
                    saveSettings();
                }
            });

            themeToggle.addEventListener('click', () => {
                toggleTheme();
                saveSettings();
            });

            shimmerToggle.addEventListener('click', () => {
                state.settings.shimmerEnabled = shimmerToggle.classList.toggle('active');
                if (state.settings.shimmerEnabled) {
                    document.documentElement.style.setProperty('--title-gradient',
                        state.theme === 'dark' ?
                        'linear-gradient(90deg, #00d4ff, #3b82f6, #00d4ff)' :
                        'linear-gradient(90deg, #0a6cff, #00d4ff, #0a6cff)'
                    );
                } else {
                    document.documentElement.style.setProperty('--title-gradient',
                        'linear-gradient(90deg, var(--primary), var(--primary))');
                }
                saveSettings();
            });

            loadingAnimToggle.addEventListener('click', () => {
                state.settings.loadingAnimEnabled = loadingAnimToggle.classList.toggle('active');
                saveSettings();
            });

            densitySelect.addEventListener('change', () => {
                state.settings.density = densitySelect.value;
                applyDensity(state.settings.density);
                saveSettings();
            });

            fontSizeSelect.addEventListener('change', () => {
                state.settings.fontSize = fontSizeSelect.value;
                applyFontSize(state.settings.fontSize);
                saveSettings();
            });

            animSpeedSelect.addEventListener('change', () => {
                state.settings.animSpeed = animSpeedSelect.value;
                applyAnimSpeed(state.settings.animSpeed);
                saveSettings();
            });

            defaultSortSelect.addEventListener('change', () => {
                state.settings.defaultSort = defaultSortSelect.value;
                state.sortDirection = defaultSortSelect.value;
                renderResourceList();
                saveSettings();
            });

            // ============ 不蒜子统计 ============
            (function loadBusuanzi() {
                const script = document.createElement('script');
                script.async = true;
                script.src = '//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
                script.onerror = () => {
                    // 不蒜子加载失败时静默处理
                };
                document.head.appendChild(script);
            })();

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (passwordModal.style.display === 'flex') hidePasswordModal();
                    if (identityModal.style.display === 'flex') hideIdentityModal();
                    if (settingsOverlay.style.display === 'flex') {
                        settingsOverlay.style.display = 'none';
                        saveSettings();
                    }
                }
            });

            // ============ 初始化 ============
            async function init() {
                loadSettings();
                applyTheme(state.theme || 'light');
                loadAllResources();
                // 预加载管理员密码
                const keyContent = await fetchText('库/key.txt');
                if (keyContent) state.adminPassword = keyContent;
            }

            init();

            // ============ 窗口调整 ============
            window.addEventListener('resize', () => {
                // 响应式调整
            });

            console.log('APEX资源中心 已加载');
            console.log('提示：该页面为纯静态实现，资源列表通过连续编号探测或清单文件（库/list/list.txt）获取。');
            console.log('如需使用清单文件，请在 库/list/ 文件夹中创建 list.txt，每行写一个资源编号。');
            console.log('关于页面可在 库/about/ 文件夹中放置 list.txt 清单文件来精确控制文件列表。');
        })();
    </script>
</body>
</html>
